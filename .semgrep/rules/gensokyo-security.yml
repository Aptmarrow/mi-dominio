rules:
  - id: gensokyo.no-dynamic-inline-events
    message: Evita interpolar datos dinamicos dentro de atributos on* inline. Usa addEventListener y estado interno.
    severity: ERROR
    languages:
      - regex
    pattern-regex: 'on(click|change|input|submit|keypress|keydown|keyup)\s*=\s*"[^\"]*\$\{[^}]+\}[^\"]*"'

  - id: gensokyo.no-untrusted-innerhtml
    message: Evita usar innerHTML con datos no confiables. Preferi DOMParser inerte o textContent.
    severity: WARNING
    languages:
      - javascript
      - typescript
    pattern: $EL.innerHTML = $VALUE

  - id: gensokyo.sandbox-weak-combo
    message: allow-scripts junto con allow-same-origin debilita el sandbox. Usa modo secure por defecto.
    severity: WARNING
    languages:
      - regex
    pattern-regex: 'sandbox\s*=\s*"[^"]*allow-scripts[^"]*allow-same-origin[^"]*"'

  - id: gensokyo.weak-userid-generator
    message: Evita IDs de 4 digitos con Math.random para identidad/autorizacion.
    severity: ERROR
    languages:
      - regex
    pattern-regex: 'Math\.floor\(1000\s*\+\s*Math\.random\(\)\s*\*\s*9000\)'
